[package]
name = "lanternleaf-egui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.25"
lanternleaf-app = { path = "../lanternleaf-app" }
lanternleaf-core = { path = "../lanternleaf-core" }
tracing = "0.1"
tracing-appender = "0.2"
image = "0.24"
pdfium-auto = { version = "0.3", features = ["bundled"] }
pdfium-render = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
