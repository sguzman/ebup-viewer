name: gui-migration

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check core Rust app
        run: cargo check

      - name: Test core Rust app
        run: cargo test -p lanternleaf-app

      - name: Build workspace
        run: cargo build --workspace
