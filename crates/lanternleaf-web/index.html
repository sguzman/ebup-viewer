<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LanternLeaf</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
      }
      #lanternleaf_canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="lanternleaf_canvas"></canvas>
    <script type="module">
      // Trunk injects the wasm-bindgen module loader and exposes bindings on
      // `window.wasmBindings`, then fires `TrunkApplicationStarted`.
      window.addEventListener("TrunkApplicationStarted", () => {
        if (!window.wasmBindings || !window.wasmBindings.start) {
          console.error("Missing wasm bindings; did Trunk fail to initialize?");
          return;
        }
        window.wasmBindings.start("lanternleaf_canvas");
      });
    </script>
  </body>
</html>
