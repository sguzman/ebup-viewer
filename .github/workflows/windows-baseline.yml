name: windows-baseline

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  native-workspace:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM for bindgen
        shell: pwsh
        run: |
          choco install llvm --no-progress --yes
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            throw "LLVM installation did not provide libclang.dll at $llvmBin"
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace
