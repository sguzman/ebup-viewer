[package]
name = "lanternleaf-egui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.25"
lanternleaf-core = { path = "../lanternleaf-core" }
tracing = "0.1"
image = "0.25.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
lol_html = "2.7.2"
http = "1.1"
percent-encoding = "2.3.2"
fontdb = "0.23.0"
pulldown-cmark = "0.13.3"
scraper = "0.25.0"
ego-tree = "0.10.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lanternleaf-app = { path = "../lanternleaf-app" }
tracing-appender = "0.2"
pdfium-auto = { version = "0.3", features = ["bundled"] }
pdfium-render = "0.8"
raw-window-handle = "0.6.2"
raw-window-handle-05 = { package = "raw-window-handle", version = "0.5.2" }
libc = "0.2"
winapi = { version = "0.3.9", features = ["winuser", "windef"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
tracing-wasm = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3.70", features = ["BinaryType", "Blob", "CloseEvent", "Document", "DomRect", "DomTokenList", "Element", "ErrorEvent", "FileReader", "HtmlAudioElement", "HtmlDivElement", "Location", "MessageEvent", "NodeList", "ProgressEvent", "WebSocket", "Window"] }
getrandom = { version = "0.2", features = ["js"] }
