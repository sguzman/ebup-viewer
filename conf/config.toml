[appearance]
theme = "day"
font_family = "lexend"
font_weight = "bold"
font_size = 26
line_spacing = 1.0
word_spacing = 0
letter_spacing = 0
lines_per_page = 1000
margin_horizontal = 220
margin_vertical = 0

[appearance.day_highlight]
r = 0.2
g = 0.4
b = 0.7
a = 0.6

[appearance.night_highlight]
r = 0.8
g = 0.8
b = 0.5
a = 0.6

[window]
width = 1624.0
height = 768.0

[reading_behavior]
pause_after_sentence = 0.06
auto_scroll_tts = true
center_spoken_sentence = true
text_only_show_original_text = false
tts_pause_resume_behavior = "resume_from_pause_point"
time_remaining_display = "adaptive"

[ui]
show_tts = true
show_settings = true
show_stats = false
chrome_font_scale = 0.62
dual_view_pipeline_enabled = true
native_html_pretty_enabled = true
native_html_pagination_mode = "sentence_window"

[ui.pretty]
enabled = true
base_font_scale = 0.9
heading_scale_h1 = 1.7
heading_scale_h2 = 1.45
heading_scale_h3 = 1.25
heading_scale_h4 = 1.1
heading_scale_h5 = 1.0
heading_scale_h6 = 0.95
paragraph_spacing = 6.0
block_spacing = 10.0
list_indent = 20.0
list_item_spacing = 4.0
hr_thickness = 1.0
hr_margin = 10.0
code_font_scale = 0.9
code_bg_alpha = 0.08
code_border_alpha = 0.18
image_max_width_pct = 95.0
image_max_height_px = 520.0
image_cache_max_entries = 128
table_cell_padding = 6.0
table_border_alpha = 0.16
table_stripe_alpha = 0.05

[ui.pretty.link_color]
r = 0.3
g = 0.55
b = 0.95
a = 1.0

[logging]
log_level = "debug"

[storage]
cache_dir = ".cache"

[integration]
browser_tabs_enabled = true
browsr_base_url = "http://127.0.0.1:17373"
browsr_timeout_ms = 8000
close_browser_tab_on_recent_delete = true

[tts]
tts_model_path = "/home/admin/Music/models/piper/en-US/female/en_US-amy-medium.onnx"
tts_espeak_path = "/usr/share"
tts_speed = 2.5
tts_volume = 1.0
tts_threads = 4
normalizer_threads = 8
tts_progress_log_interval_secs = 5.0

[keybindings]
toggle_play_pause = "space"
safe_quit = "q"
next_sentence = "f"
prev_sentence = "s"
repeat_sentence = "r"
toggle_search = "ctrl+f"
toggle_settings = "ctrl+t"
toggle_stats = "ctrl+g"
toggle_tts = "ctrl+y"
