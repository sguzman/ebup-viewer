[package]
name = "lanternleaf"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/lanternleaf-core", "crates/lanternleaf-app", "crates/lanternleaf-egui"]
resolver = "2"

# Repo-native desktop QA needs representative egui optimization while retaining symbols and
# diagnostics useful for local investigation. CI keeps using the normal check/build/test profiles.
[profile.qa]
inherits = "release"
opt-level = 2
debug = true
strip = "none"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
piper-rs = "0.1.9"
hound = "3.5"
lanternleaf-core = { path = "crates/lanternleaf-core" }
lanternleaf-app = { path = "crates/lanternleaf-app" }
lanternleaf-egui = { path = "crates/lanternleaf-egui" }

[patch.crates-io]
espeak-rs-sys = { path = "vendor/espeak-rs-sys" }
pdfium-auto = { path = "vendor/pdfium-auto" }
sonic-rs-sys = { path = "vendor/sonic-rs-sys" }
