[package]
name = "lanternleaf-egui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.25"
lanternleaf-app = { path = "../lanternleaf-app" }
lanternleaf-core = { path = "../lanternleaf-core" }
tracing = "0.1"
tracing-appender = "0.2"
image = "0.25.10"
pdfium-auto = { version = "0.3", features = ["bundled"] }
pdfium-render = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
lol_html = "2.7.2"
http = "1.1"
percent-encoding = "2.3.2"
raw-window-handle = "0.6.2"
raw-window-handle-05 = { package = "raw-window-handle", version = "0.5.2" }
libc = "0.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
