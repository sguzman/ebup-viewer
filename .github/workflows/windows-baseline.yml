name: windows-baseline

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  native-workspace:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Pandoc
        shell: pwsh
        run: |
          if (-not (Get-Command pandoc -ErrorAction SilentlyContinue)) {
            choco install pandoc --yes --no-progress
          }

      - name: Check Windows prerequisites
        shell: pwsh
        run: ./scripts/windows-dev-check.ps1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Native launch smoke
        shell: pwsh
        env:
          LANTERNLEAF_EFRAME_RENDERER: wgpu
        run: |
          $binary = Join-Path $pwd "target\debug\lanternleaf.exe"
          if (-not (Test-Path $binary)) {
            throw "Expected native binary was not produced: $binary"
          }
          $stdout = Join-Path $env:RUNNER_TEMP "lanternleaf-launch.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "lanternleaf-launch.stderr.log"
          Remove-Item $stdout, $stderr -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $binary -WorkingDirectory $pwd `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              Write-Host "Native launch stdout:"
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host "Native launch stderr:"
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "Native egui process exited during launch smoke with code $($process.ExitCode)"
            }
            Write-Host "Native egui process remained running for the launch smoke."
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Test workspace
        run: cargo test --workspace
