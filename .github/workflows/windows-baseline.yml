name: windows-baseline

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  native-workspace:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Pandoc
        shell: pwsh
        run: |
          if (-not (Get-Command pandoc -ErrorAction SilentlyContinue)) {
            choco install pandoc --yes --no-progress
          }

      - name: Check Windows prerequisites
        shell: pwsh
        run: ./scripts/windows-dev-check.ps1

      - name: Check repo-native dependency bootstrap
        shell: pwsh
        run: ./deps.ps1 -CheckOnly

      - name: Prepare repo-native QA path
        shell: pwsh
        run: ./qa.ps1 -SkipDependencyCheck -PrepareOnly

      - name: Test Codex goal notification workflow
        shell: pwsh
        run: ./scripts/test-codex-goal-notify.ps1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Windows TTS probe with diagnostics
        run: cargo test -p lanternleaf-core --test windows_tts -- --nocapture

  hosted-renderer-probe:
    needs: native-workspace
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build workspace for renderer probe
        run: cargo build --workspace

      - name: Hosted renderer capability probe
        shell: pwsh
        run: |
          $binary = Join-Path $pwd "target\debug\lanternleaf.exe"
          if (-not (Test-Path $binary)) {
            throw "Expected native binary was not produced: $binary"
          }
          $stdout = Join-Path $env:RUNNER_TEMP "lanternleaf-launch.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "lanternleaf-launch.stderr.log"
          Remove-Item $stdout, $stderr -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $binary -WorkingDirectory $pwd `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              Write-Host "Native launch stdout:"
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host "Native launch stderr:"
              if (Test-Path $stderr) { Get-Content $stderr }
              $diagnostics = @()
              if (Test-Path $stdout) { $diagnostics += Get-Content $stdout }
              if (Test-Path $stderr) { $diagnostics += Get-Content $stderr }
              $diagnosticText = $diagnostics -join "`n"
              $knownUnavailable = $diagnosticText -match "requires opengl 2\.0\+" `
                -or $diagnosticText -match "NoSuitableAdapterFound" `
                -or $diagnosticText -match "no suitable adapter" `
                -or $diagnosticText -match "No wgpu adapters found" `
                -or $diagnosticText -match "Returned GL context is 1\.1"
              if ($knownUnavailable) {
                Write-Host "hosted_renderer_unavailable: runner lacks a supported graphics adapter/context."
                exit 0
              }
              throw "Unexpected native renderer startup failure with code $($process.ExitCode)"
            }
            Write-Host "renderer_supported: native egui process remained running for the probe window."
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
